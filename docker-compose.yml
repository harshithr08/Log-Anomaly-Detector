services:
  redis:
    image: redis:7.4-alpine
    # appendonly: write every change to disk, so queued logs survive a restart
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: logad
      POSTGRES_PASSWORD: logad
      POSTGRES_DB: logad
    ports:
      # 5433 on the host: avoids clashing with a locally installed Postgres
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logad -d logad"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  postgres-data:
