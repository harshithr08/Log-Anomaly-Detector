# Settings shared by the pipeline processes.
x-pipeline: &pipeline
  build: .
  image: logad
  restart: unless-stopped
  environment: &pipeline-env
    LOGAD_REDIS_URL: redis://redis:6379/0
    LOGAD_DATABASE_URL: postgresql+asyncpg://logad:logad@postgres:5432/logad

# Settings shared by the four shop services.
x-shop-service: &shop-service
  build: .
  image: logad
  restart: unless-stopped # also brings a service back after a 'crash' fault
  volumes:
    - ./runtime:/app/runtime # logs + ground truth, visible on the host
  environment:
    SHOP_SHOP_URL: http://shop:8000
    SHOP_INVENTORY_URL: http://inventory:8000
    SHOP_PAYMENT_URL: http://payment:8000
    SHOP_SHIPPING_URL: http://shipping:8000
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  # ── infrastructure ──────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    # appendonly: write every change to disk, so queued logs survive a restart
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: logad
      POSTGRES_PASSWORD: logad
      POSTGRES_DB: logad
    ports:
      # 5433 on the host: avoids clashing with a locally installed Postgres
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logad -d logad"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── pipeline ────────────────────────────────────────────────────────────────
  migrate: # one-shot: create / update the database tables, then exit
    <<: *pipeline
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  # ── demo shop (the system being monitored) ──────────────────────────────────
  shop:
    <<: *shop-service
    command: ["uvicorn", "shop.gateway:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "8000:8000"
    depends_on:
      inventory: { condition: service_healthy }
      payment: { condition: service_healthy }
      shipping: { condition: service_healthy }

  inventory:
    <<: *shop-service
    command: ["uvicorn", "shop.inventory:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "8001:8000"

  payment:
    <<: *shop-service
    command: ["uvicorn", "shop.payment:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "8002:8000"

  shipping:
    <<: *shop-service
    command: ["uvicorn", "shop.shipping:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "8003:8000"

  traffic:
    image: logad
    restart: unless-stopped
    command: ["python", "-m", "shop.traffic"]
    environment:
      SHOP_SHOP_URL: http://shop:8000
      TRAFFIC_RATE: ${TRAFFIC_RATE:-10}
    depends_on:
      shop: { condition: service_healthy }

volumes:
  redis-data:
  postgres-data:
