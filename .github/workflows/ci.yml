name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.17.1
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: logad
          POSTGRES_PASSWORD: logad
          POSTGRES_DB: logad
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U logad -d logad"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,train]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pytest -v

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --wait --build
      - run: docker compose ps
      - name: Smoke test the shop
        run: |
          curl -fsS http://127.0.0.1:8000/products > /dev/null
          curl -fsS -X POST http://127.0.0.1:8000/checkout -H 'content-type: application/json' \
            -d '{"items":[{"product_id":"p17","quantity":1}],"card_number":"4242"}' || true
          sleep 5
          grep -q "Handling GET /products" runtime/logs/shop.log
          grep -q "Handling POST /charges" runtime/logs/payment.log
          wc -l runtime/logs/*.log
      - name: Smoke test the pipeline (logs -> sessions in Postgres)
        run: |
          for i in $(seq 30); do
            n=$(docker compose exec -T postgres psql -U logad -d logad -tAc "select count(*) from sessions")
            echo "sessions: $n"
            [ "$n" -gt 20 ] && exit 0
            sleep 2
          done
          exit 1
      - if: failure()
        run: docker compose logs --tail 50
      - run: docker compose down -v

  chaos:
    # Kill pipeline workers at random under traffic; fail on any lost or
    # duplicated line.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - run: python -u eval/chaos.py --duration 60 --every 6 --fresh
      - if: always()
        run: cat eval/results/chaos.md || true
      - if: failure()
        run: docker compose logs --tail 80
      - if: always()
        run: docker compose down -v
