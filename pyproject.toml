[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "logad"
version = "0.1.0"
description = "Live log anomaly detection pipeline"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "drain3==0.9.11",
    "fastapi==0.156.3",
    "hiredis==3.5.0",  # C parser for Redis replies: the builder ran 2.7x faster with it
    "httpx==0.28.1",
    "joblib==1.6.0",
    "numpy==2.4.6",
    "onnxruntime==1.31.0",
    "pydantic-settings==2.16.1",
    "redis==8.1.0",
    "scikit-learn==1.9.1",
    "sqlalchemy[asyncio]==2.1.5",
    "uvicorn==0.54.0",
    "websockets==17.3",  # WebSocket support for uvicorn (the dashboard's live feed)
]

[project.optional-dependencies]
# Training only (not in the Docker image). For the small CPU build of PyTorch:
#   pip install -e ".[train]" --extra-index-url https://download.pytorch.org/whl/cpu
train = [
    "onnx==1.23.2",
    "torch==2.14.1",
]
dev = [
    "pillow==13.0.0",  # only for recording docs/demo.gif (eval/demo_gif.py)
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logad = ["api/static/*"]  # the dashboard page

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: errors, I: import order, UP: modern syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs Redis and Postgres running (docker compose up -d)",
]
filterwarnings = [
    # Starlette's TestClient nags about a future httpx swap; not our code.
    "ignore:Using `httpx` with `starlette.testclient`",
]
